name: "Pengumpulan Tugas 1 (Social Media Analytics)"
description: "Kumpulkan Tugas 1: Satu Medsos, Banyak Temuan. Tenggat 27 November 2026, pukul 20.00 waktu setempat."
title: "[Tugas 1] NIM - Nama Lengkap"
labels: ["tugas-1", "pengumpulan"]
body:
  - type: markdown
    attributes:
      value: |
        ## Tugas 1: Satu Medsos, Banyak Temuan
        Pilih satu media sosial yang datanya paling mudah kamu ambil, tentukan satu topik yang kamu peduli, lalu cari temuan sebanyak-banyaknya beserta buktinya. Nilai mengikuti temuan yang bisa dibuktikan, bukan panjang tulisan.

        **Tenggat: 27 November 2026, pukul 20.00 waktu setempat.**

        **Cara melampirkan:** tarik berkas (data, log, laporan, rekaman) langsung ke kolom isian di bawah, atau cukup tempel tautannya.

        **Catatan:** repositori ini publik. Hindari data pribadi sensitif di luar yang diminta form ini.
  - type: input
    id: nama
    attributes:
      label: Nama Lengkap
      placeholder: "Contoh: Budi Santoso"
    validations:
      required: true
  - type: input
    id: nim
    attributes:
      label: NIM
      placeholder: "Contoh: 23012345"
    validations:
      required: true
  - type: input
    id: kelas
    attributes:
      label: Kelas
      placeholder: "Contoh: TI-3A"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform yang dipilih
      placeholder: "Contoh: Reddit, Bluesky, YouTube, TikTok"
    validations:
      required: true
  - type: input
    id: topik
    attributes:
      label: Topik atau tagar yang diamati
      placeholder: "Contoh: kampanye kopi bubuk UMKM di TikTok"
    validations:
      required: true
  - type: input
    id: tautan_data
    attributes:
      label: Tautan data (repositori pribadi atau Google Drive)
      description: "Kalau Google Drive, pastikan aksesnya 'siapa pun dengan tautan bisa lihat'."
      placeholder: "https://github.com/namamu/sma-tugas-1-nim"
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: Checksum SHA-256 berkas data utama
      description: "Perintah di Termux/Linux: sha256sum data.csv"
      placeholder: "Contoh: 64 karakter hex"
    validations:
      required: true
  - type: textarea
    id: temuan
    attributes:
      label: Temuan (3 sampai 5, satu baris satu temuan)
      description: "Tulis temuannya dengan angkanya. Contoh: komentar paling ramai pukul 23.00-01.00 (627 dari 1.204 baris, 52%)."
      placeholder: |
        1. Jam paling ramai ...
        2. Akun paling sering muncul ...
        3. Persentase reshare ...
    validations:
      required: true
  - type: input
    id: rekaman
    attributes:
      label: Tautan rekaman penjelasan 3 menit
      description: "Boleh unggahan YouTube, Drive, atau tautan berkas di tempat data disimpan."
    validations:
      required: false
  - type: checkboxes
    id: pernyataan
    attributes:
      label: Pernyataan
      options:
        - label: Data dikumpulkan sendiri lewat jalur yang sah (API resmi atau halaman publik)
          required: true
        - label: Berkas mentah tidak diubah, hasil olahan ada di berkas lain
          required: true
        - label: Tidak ada data pribadi orang lain (grup tertutup, chat pribadi) di dalam berkas
          required: true
