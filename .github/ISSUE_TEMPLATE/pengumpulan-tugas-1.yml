name: "Pengumpulan Tugas 1"
description: "Tugas 1: Satu Medsos, Banyak Temuan. Tenggat 27 November 2026 pukul 20.00."
title: "[Tugas 1] NIM - Nama"
labels: ["tugas-1", "pengumpulan"]
body:
  - type: markdown
    attributes:
      value: |
        **Tugas 1: Satu Medsos, Banyak Temuan**
        Pilih satu media sosial yang datanya paling mudah kamu ambil, tentukan satu topik yang kamu peduli, lalu cari temuan sebanyak-banyaknya beserta buktinya. Nilai mengikuti temuan yang bisa dibuktikan, bukan panjang tulisan.

        **Tenggat: 27 November 2026, pukul 20.00 waktu setempat.**
  - type: input
    id: nama
    attributes:
      label: Nama
      placeholder: "Contoh: Budi Santoso"
    validations:
      required: true
  - type: input
    id: nim
    attributes:
      label: NIM
      placeholder: "Contoh: 23012345"
    validations:
      required: true
  - type: input
    id: kelas
    attributes:
      label: Kelas
      placeholder: "Contoh: TI-3A"
    validations:
      required: true
  - type: textarea
    id: temuan
    attributes:
      label: Temuan
      description: "Tulis 3 sampai 5 temuan beserta angkanya. Satu baris satu temuan."
      placeholder: |
        1. Jam paling ramai ...
        2. Akun paling sering muncul ...
        3. Persentase reshare ...
    validations:
      required: true
  - type: input
    id: pdf
    attributes:
      label: PDF laporan
      description: "Tempel tautan PDF (Google Drive, GitHub, atau sejenisnya). Setelah Issue dibuat kamu juga bisa tarik berkas PDF langsung ke kolom komentar."
      placeholder: "https://drive.google.com/..."
    validations:
      required: true
  - type: checkboxes
    id: pernyataan
    attributes:
      label: Pernyataan
      options:
        - label: Data dikumpulkan sendiri dan temuan bisa dibuktikan dari data tersebut
          required: true
